[project]
name = "mcp-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "packaging>=24",
    "fastmcp>=4.0,<5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
# ORT 経路（既定モデル ruri-v3-30m）に必要な依存も明示する。fastembed の推移依存に
# 頼ると、fastembed 側の依存変更で既定の埋め込みが静かに読めなくなる。
embeddings = [
    "fastembed>=0.4.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.23",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.5",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: slow integration tests that need real processes",
]

[tool.setuptools.packages.find]
where = ["src"]
